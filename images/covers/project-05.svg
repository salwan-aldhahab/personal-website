<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="YUPlanner academic scheduler web app interface">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13213f"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#4ecdc4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4ecdc4" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>
  <rect width="800" height="500" fill="url(#grid5)"/>
  <rect width="800" height="500" fill="url(#glow5)"/>

  <text x="48" y="62" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#4ecdc4">FULL-STACK · REACT + SPRING</text>
  <text x="752" y="70" text-anchor="end" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="700" fill="#ffffff" fill-opacity="0.22">05</text>

  <!-- browser window -->
  <g>
    <rect x="112" y="96" width="576" height="312" rx="16" fill="#0e1730" stroke="#26355c" stroke-width="2"/>
    <!-- title bar -->
    <path d="M112 112a16 16 0 0 1 16 -16h544a16 16 0 0 1 16 16v26H112Z" fill="#111a35"/>
    <circle cx="140" cy="125" r="6" fill="#f77f00"/>
    <circle cx="160" cy="125" r="6" fill="#f4d35e"/>
    <circle cx="180" cy="125" r="6" fill="#4ecdc4"/>
    <text x="400" y="131" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6e9f0">YUPlanner</text>

    <!-- day header -->
    <g font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="14" fill="#94a2c4" text-anchor="middle">
      <text x="216" y="176">MON</text><text x="304" y="176">TUE</text><text x="392" y="176">WED</text><text x="480" y="176">THU</text><text x="568" y="176">FRI</text>
    </g>
    <!-- grid lines -->
    <g stroke="#22315a" stroke-width="1">
      <line x1="128" y1="190" x2="672" y2="190"/>
      <line x1="128" y1="238" x2="672" y2="238"/>
      <line x1="128" y1="286" x2="672" y2="286"/>
      <line x1="128" y1="334" x2="672" y2="334"/>
      <line x1="172" y1="158" x2="172" y2="382"/>
      <line x1="260" y1="158" x2="260" y2="382"/>
      <line x1="348" y1="158" x2="348" y2="382"/>
      <line x1="436" y1="158" x2="436" y2="382"/>
      <line x1="524" y1="158" x2="524" y2="382"/>
      <line x1="612" y1="158" x2="612" y2="382"/>
    </g>
    <!-- course blocks -->
    <rect x="178" y="194" width="76" height="66" rx="7" fill="#4ecdc4" fill-opacity="0.85"/>
    <rect x="354" y="194" width="76" height="90" rx="7" fill="#f77f00" fill-opacity="0.85"/>
    <rect x="530" y="242" width="76" height="88" rx="7" fill="#3a6df0" fill-opacity="0.85"/>
    <rect x="266" y="290" width="76" height="66" rx="7" fill="#e05a8a" fill-opacity="0.85"/>
    <rect x="442" y="290" width="76" height="42" rx="7" fill="#4caf50" fill-opacity="0.85"/>
  </g>

  <!-- stack chips -->
  <g font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g><rect x="196" y="436" width="96" height="34" rx="17" fill="#111a35" stroke="#4ecdc4" stroke-opacity="0.5"/><text x="244" y="458" fill="#4ecdc4">React</text></g>
    <g><rect x="308" y="436" width="128" height="34" rx="17" fill="#111a35" stroke="#4ecdc4" stroke-opacity="0.5"/><text x="372" y="458" fill="#4ecdc4">Spring Boot</text></g>
    <g><rect x="452" y="436" width="104" height="34" rx="17" fill="#111a35" stroke="#4ecdc4" stroke-opacity="0.5"/><text x="504" y="458" fill="#4ecdc4">MySQL</text></g>
  </g>
</svg>
